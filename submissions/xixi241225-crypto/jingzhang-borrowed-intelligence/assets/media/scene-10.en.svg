<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Slow-Intelligence Retail Assistant</title><desc>Dazhongsi public ground floor</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S10 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Slow-Intelligence Retail Assistant</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Dazhongsi public ground floor</text><image x="95" y="255" width="1560" height="878" href="scene-10.webp" preserveAspectRatio="xMidYMid meet"/><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">Obtain explanations or use ordinary checkout</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Paper menu, staffed counter, optional terminal and free seating</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">AI-generated concept; unscaled, not an existing-condition reconstruction or implementation approval. Labels are separate editable text.</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Low-tech baseline</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Ordinary menus, cash and standard checkout,</text><text x="1740" y="402.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">staffed advice, and clear prices</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI enhancement</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Explain recommendations, allergens, and</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">commercial relationships; personalization can be</text><text x="1740" y="810.84" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">disabled and must not enable profile-based price</text><text x="1740" y="853.76" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">discrimination.</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Human responsibility</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Merchant checks prices/allergens; recommendations</text><text x="1740" y="1132.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">can be disabled</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Dazhongsi public ground floor</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Participant spatial/service proposal / Source: PARTICIPANT-DESIGN-V12 / Not achieved outcomes</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.4 / 2026-10-06</text></svg>