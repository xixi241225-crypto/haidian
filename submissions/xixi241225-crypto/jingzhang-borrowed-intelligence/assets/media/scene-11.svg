<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>创新资源门厅</title><desc>AI 原点两门资源接口</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S11 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">创新资源门厅</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">AI 原点两门资源接口</text><image x="95" y="255" width="1560" height="878" href="resource-foyer.webp" preserveAspectRatio="xMidYMid meet"/><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">带着问题找到可协商的资源</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">实体目录、低柜台、人工转介与等待座椅</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">AI 生成概念意向；无比例，不是现状复原或实施批准。图中文字为独立可编辑层。</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">非 AI 基线</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">服务目录、固定开放时间和人工转介</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI 增强</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">辅助匹配空间、导师与专业服务；不承诺结果，敏感申请</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">由人工受理。</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">人工责任</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">资源提供者维护时段和权限；不保证匹配或结果</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">AI 原点两门资源接口</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">空间与服务均为参与者建议 / 来源：PARTICIPANT-DESIGN-V12 / 非已实施绩效</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>