70" y="422.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Interpretation and free seating turn arrival into a</text><text x="1870" y="461.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">place to pause.</text><circle cx="1880.0" cy="630.0" r="24" fill="#bd783b" stroke="none" stroke-width="2"/><text x="1880" y="639" fill="white" font-size="23" font-weight="600" text-anchor="middle">02</text><text x="1930" y="635.0" fill="#bd783b" font-size="33" font-weight="400" text-anchor="start">Public ground floors</text><text x="1870" y="727.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Staffed help, cash payment and paper</text><text x="1870" y="766.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">information come first.</text><circle cx="1880.0" cy="935.0" r="24" fill="#177a70" stroke="none" stroke-width="2"/><text x="1880" y="944" fill="white" font-size="23" font-weight="600" text-anchor="middle">03</text><text x="1930" y="940.0" fill="#177a70" font-size="33" font-weight="400" text-anchor="start">Connect four areas</text><text x="1870" y="1032.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Verify each crossing separately; abstract</text><text x="1870" y="1071.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">diagonals are not walking routes.</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Spatial strategy / Unscaled; verify exact routes, permission and engineering conditions</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.4 / 2026-10-06</text></svg>