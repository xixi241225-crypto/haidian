ation</text><rect x="1830" y="1070" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="1070" width="7" height="235" fill="#687772"/><text x="1855" y="1118" fill="#687772" font-size="31" font-weight="600" text-anchor="start">Respect culture and ordinary passage</text><text x="1855" y="1170" fill="#687772" font-size="25" font-weight="400" text-anchor="start">Separate authentic heritage interpretation from new fittings</text><text x="1855" y="1210" fill="#687772" font-size="25" font-weight="400" text-anchor="start">No assumed bridge, tunnel, deck or heritage works</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Access relationships are proposals; dimensions, terrain, fire and engineering conditions remain to verify</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>