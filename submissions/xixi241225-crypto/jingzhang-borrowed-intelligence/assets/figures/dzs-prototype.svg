<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>大钟寺 · 慢智都会园｜功能与流线</title><desc>无比例功能与邻接原型｜用于组织路径、使用与权限；不对应已选宗地</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">B03F / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">大钟寺 · 慢智都会园｜功能与流线</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">无比例功能与邻接原型｜用于组织路径、使用与权限；不对应已选宗地</text><rect x="85" y="245" width="1695" height="1240" rx="0" fill="#fffdf8" stroke="#d9d5ca"/><rect x="190" y="340" width="1440" height="1040" rx="8" fill="#ece7df" stroke="#c8c2b7"/><path d="M220.0,825.0 L1620.0,825.0" fill="none" stroke="#d8d6ce" stroke-width="110" stroke-linejoin="round" stroke-linecap="round"/><path d="M900.0,380.0 L900.0,1340.0" fill="none" stroke="#d8d6ce" stroke-width="95" stroke-linejoin="round" stroke-linecap="round"/><rect x="215" y="865" width="300" height="470" rx="40" fill="#e4e9dc" stroke="#d9d5ca"/><text x="365" y="945" fill="#79698f" font-size="32" font-weight="600" text-anchor="middle">文化停留</text><rect x="256" y="397" width="500" height="220" rx="1" fill="#ded7c9" stroke="none"/><rect x="250" y="390" width="500" height="220" rx="1" fill="#e1e8dc" stroke="#acaa9e"/><path d="M257,402H743" stroke="#9b9f99" stroke-width="4"/><text x="500.0" y="508.4" fill="#18302f" font-size="24" font-weight="500" text-anchor="middle">普通服务 / 公共首层</text><rect x="1046" y="382" width="470" height="230" rx="1" fill="#ded7c9" stroke="none"/><rect x="1040" y="375" width="470" height="230" rx="1" fill="#e9dfcd" stroke="#acaa9e"/><path d="M1047,387H1503" stroke="#9b9f99" stroke-width="4"/><text x="1275.0" y="499.45" fill="#18302f" font-size="27" font-weight="500" text-anchor="middle">内容与交流</text><rect x="1046" y="1027" width="470" height="220" rx="1" fill="#ded7c9" stroke="none"/><rect x="1040" y="1020" width="470" height="220" rx="1" fill="#e1e8dc" stroke="#acaa9e"/><path d="M1047,1032H1503" stroke="#9b9f99" stroke-width="4"/><text x="1275.0" y="1138.75" fill="#18302f" font-size="25" font-weight="500" text-anchor="middle">透明消费 / 人工咨询</text><rect x="1035" y="690" width="405" height="155" rx="35" fill="#e6ded0" stroke="#d9d5ca"/><text x="1230" y="750" fill="#79698f" font-size="29" font-weight="600" text-anchor="middle">非消费停留</text><circle cx="750.0" cy="1080.0" r="155" fill="#e4e9dc" stroke="#adbd9f" stroke-width="3"/><text x="750" y="1065" fill="#79698f" font-size="31" font-weight="600" text-anchor="middle">慢智公场</text><text x="750" y="1125" fill="#687772" font-size="24" font-weight="400" text-anchor="middle">福祉公开账本</text><path d="M260.0,735.0 L840.0,735.0 L995.0,655.0 L1540.0,655.0 L1540.0,935.0 L1010.0,935.0 L930.0,1245.0 L600.0,1245.0 L600.0,935.0 L260.0,935.0 L260.0,735.0" fill="none" stroke="#79698f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="18 8"/><rect x="286" y="691" width="385.5" height="40" rx="5" fill="#fffdf7" stroke="none"/><text x="295" y="720" fill="#79698f" font-size="25" font-weight="600" text-anchor="start">四象限联系 / 核验后分段接通</text><rect x="621" y="1381" width="410.0" height="40" rx="5" fill="#fffdf7" stroke="none"/><text x="630" y="1410" fill="#79698f" font-size="25" font-weight="600" text-anchor="start">轨道到达接口 / 非站点工程设计</text><circle cx="215.0" cy="398.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="210.0" cy="390.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M210.0,382.0 L210.0,398.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="775.0" cy="433.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="770.0" cy="425.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M770.0,417.0 L770.0,433.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1535.0" cy="433.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1530.0" cy="425.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1530.0,417.0 L1530.0,433.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1545.0" cy="958.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1540.0" cy="950.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1540.0,942.0 L1540.0,958.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1485.0" cy="1338.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1480.0" cy="1330.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1480.0,1322.0 L1480.0,1338.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="535.0" cy="1268.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="530.0" cy="1260.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M530.0,1252.0 L530.0,1268.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="365.0" cy="1158.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="360.0" cy="1150.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M360.0,1142.0 L360.0,1158.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="655.0" cy="668.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="650.0" cy="660.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M650.0,652.0 L650.0,668.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="1830" y="245" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="245" width="7" height="235" fill="#177a70"/><text x="1855" y="293" fill="#177a70" font-size="31" font-weight="600" text-anchor="start">把到达变成可停留</text><text x="1855" y="345" fill="#687772" font-size="25" font-weight="400" text-anchor="start">固定导视、座椅、人工问询先成立</text><text x="1855" y="385" fill="#687772" font-size="25" font-weight="400" text-anchor="start">换乘与跨路方式待交通专业核验</text><rect x="1830" y="520" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="520" width="7" height="235" fill="#bd783b"/><text x="1855" y="568" fill="#bd783b" font-size="31" font-weight="600" text-anchor="start">公共首层承接普通服务</text><text x="1855" y="620" fill="#687772" font-size="25" font-weight="400" text-anchor="start">现金、纸质菜单与清晰价格保留</text><text x="1855" y="660" fill="#687772" font-size="25" font-weight="400" text-anchor="start">不注册也能进入基本服务空间</text><rect x="1830" y="795" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="795" width="7" height="235" fill="#79698f"/><text x="1855" y="843" fill="#79698f" font-size="31" font-weight="600" text-anchor="start">慢智消费保留选择</text><text x="1855" y="895" fill="#687772" font-size="25" font-weight="400" text-anchor="start">推荐说明商业关系，可随时关闭</text><text x="1855" y="935" fill="#687772" font-size="25" font-weight="400" text-anchor="start">公共账本不显示个人数据</text><rect x="1830" y="1070" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="1070" width="7" height="235" fill="#687772"/><text x="1855" y="1118" fill="#687772" font-size="31" font-weight="600" text-anchor="start">文化与通行相互尊重</text><text x="1855" y="1170" fill="#687772" font-size="25" font-weight="400" text-anchor="start">真实遗产解释与新设施分层</text><text x="1855" y="1210" fill="#687772" font-size="25" font-weight="400" text-anchor="start">不预设桥隧、盖板或遗产拆改</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">开放与受控关系属于设计建议；精确尺寸、地形、消防和工程条件待专业深化</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>