<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>公共空间组件｜七种可组合的日常支持</title><desc>无比例功能原型；非施工详图、设备规格或造价承诺</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">D02 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">公共空间组件｜七种可组合的日常支持</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">无比例功能原型；非施工详图、设备规格或造价承诺</text><rect x="95" y="265" width="585" height="545" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="125" y="325" fill="#177a70" font-size="34" font-weight="600" text-anchor="start">C01 记忆轨</text><path d="M185.0,455.0 L575.0,570.0" fill="none" stroke="#bd783b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M185.0,495.0 L575.0,610.0" fill="none" stroke="#bd783b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text x="125" y="690.0" fill="#18302f" font-size="25" font-weight="400" text-anchor="start">异色铺装优先；金属嵌条防滑及位置另核</text><rect x="720" y="265" width="585" height="545" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="750" y="325" fill="#177a70" font-size="34" font-weight="600" text-anchor="start">C02 借景框</text><path d="M850.0,595.0 L850.0,425.0 L1180.0,425.0 L1180.0,595.0" fill="none" stroke="#177a70" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><rect x="900" y="560" width="240" height="25" rx="12" fill="#b18c62" stroke="#d9d5ca"/><text x="750" y="690.0" fill="#18302f" font-size="25" font-weight="400" text-anchor="start">观看、坐憩与解释；避免遮挡通行</text><rect x="1345" y="265" width="585" height="545" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="1375" y="325" fill="#177a70" font-size="34" font-weight="600" text-anchor="start">C03 福祉亭</text><path d="M1475.0,595.0 L1475.0