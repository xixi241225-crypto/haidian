<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Blue-Green Urban Twin</title><desc>Zhongzhiyuan / Landscape observation</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S07 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Blue-Green Urban Twin</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Zhongzhiyuan / Landscape observation</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><path d="M180.0,750.0 L500.0,750.0 L700.0,855.0 L1090.0,855.0 L1310.0,750.0 L1540.0,750.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M520.0,750.0 L720.0,850.0 L1040.0,850.0 L1230.0,750.0" fill="#d9e8e9" stroke="#729aa6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="550.0" cy="665.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><path d="M550.0,665.0 L550.0,730.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1180.0" cy="680.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><path d="M1180.0,680.0 L1180.0,745.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,690.0 L920.0,850.0" fill="none" stroke="#729aa6" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,700.0 L955.0,700.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,725.0 L955.0,725.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,750.0 L955.0,750.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,775.0 L955.0,775.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,800.0 L955.0,800.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,825.0 L955.0,825.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="1240" y="375" width="280" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="1260" y="425.0" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">Public</text><text x="1260" y="467.92" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">observation /</text><text x="1260" y="510.84000000000003" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">Human</text><text x="1260" y="553.76" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">verification</text><path d="M1260.0,605.0 L950.0,760.0" fill="none" stroke="#729aa6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="14 9"/><text x="210" y="1000.0" fill="#18302f" font-size="28" font-weight="400" text-anchor="start">Observation/maintenance relationship only; depths, overflow and slopes require design</text><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">Observe landscape change and model limits</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Gauge, plant notes, observation point and safety edge</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Editable functional diagram; unscaled; verify actual routes and facilities.</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Low-tech baseline</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Rain gauges, planting information, human</text><text x="1740" y="402.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">monitoring, and evacuation rules</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI enhancement</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Assist observation of ponding, heat, and plant</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">condition; models support maintenance judgement</text><text x="1740" y="810.84" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">but do not replace engineering conclusions.</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Human responsibility</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Professional caretaker verifies alerts; model does</text><text x="1740" y="1132.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">not replace flood/engineering decisions</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Zhongzhiyuan / Landscape observation</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Participant spatial/service proposal / Source: PARTICIPANT-DESIGN-V12 / Not achieved outcomes</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>