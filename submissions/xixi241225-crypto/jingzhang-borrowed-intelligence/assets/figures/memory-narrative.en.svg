<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Jing-Zhang memory narrative | Return sources to the public</title><desc>Separate authentic objects from additions; historic-looking form does not establish historical facts</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">D03 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Jing-Zhang memory narrative | Return sources to the public</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Separate authentic objects from additions; historic-looking form does not establish historical facts</text><rect x="95" y="280" width="770" height="640" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="135" y="360" fill="#bd783b" font-size="70" font-weight="600" text-anchor="start">01</text><text x="135" y="455" fill="#bd783b" font-size="42" font-weight="600" text-anchor="start">Authentic memory</text><text x="135" y="545.0" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">Relics / Archives / Oral histories; register</text><text x="135" y="590.88" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">sources and protection status</text><path d="M870.0,650.0 L915.0,650.0" fill="none" stroke="#bd783b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M915.0,650.0 L893.0,660.0 L893.0,640.0 L915.0,650.0" fill="#bd783b" stroke="#bd783b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="915" y="280" width="770" height="640" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="955" y="360" fill="#177a70" font-size="70" font-weight="600" text-anchor="start">02</text><text x="955" y="455" fill="#177a70" font-size="42" font-weight="600" text-anchor="start">Everyday innovation</text><text x="955" y="545.0" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">Staffed resources / Shared courts; ordinary</text><text x="955" y="590.88" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">public service comes first</text><path d="M1690.0,650.0 L1735.0,650.0" fill="none" stroke="#177a70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1735.0,650.0 L1713.0,660.0 L1713.0,640.0 L1735.0,650.0" fill="#177a70" stroke="#177a70" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="1735" y="280" width="770" height="640" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><text x="1775" y="360" fill="#79698f" font-size="70" font-weight="600" text-anchor="start">03</text><text x="1775" y="455" fill="#79698f" font-size="42" font-weight="600" text-anchor="start">Responsible intelligence</text><text x="1775" y="545.0" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">Visible sources / Corrections / Exit; publish</text><text x="1775" y="590.88" fill="#18302f" font-size="31" font-weight="400" text-anchor="start">successes and failures</text><text x="95" y="1020" fill="#177a70" font-size="38" font-weight="600" text-anchor="start">Every interpretation point answers five questions</text><rect x="95" y="1080" width="465" height="260" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="125" y="1160.0" fill="#18302f" font-size="34" font-weight="400" text-anchor="start">What is it?</text><rect x="590" y="1080" width="465" height="260" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="620" y="1160.0" fill="#18302f" font-size="34" font-weight="400" text-anchor="start">What is its source?</text><rect x="1085" y="1080" width="465" height="260" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="1115" y="1160.0" fill="#18302f" font-size="34" font-weight="400" text-anchor="start">How is it used today?</text><rect x="1580" y="1080" width="465" height="260" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="1610" y="1160.0" fill="#18302f" font-size="34" font-weight="400" text-anchor="start">Who is responsible?</text><rect x="2075" y="1080" width="465" height="260" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="2105" y="1160.0" fill="#18302f" font-size="34" font-weight="400" text-anchor="start">How is it corrected?</text><text x="95" y="1465.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Railway artifacts, interpretation panels and buildings in renderings are design intentions, not evidence of actual relics or historical facts.</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Concept design · Relationships and functions · Not a statutory or engineering plan</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.4 / 2026-10-06</text></svg>