70" width="7" height="235" fill="#687772"/><text x="1855" y="1118" fill="#687772" font-size="31" font-weight="600" text-anchor="start">I4 / 受控研发与运维</text><text x="1855" y="1170" fill="#687772" font-size="25" font-weight="400" text-anchor="start">教学、研发、设备与后台保持限制</text><text x="1855" y="1210" fill="#687772" font-size="25" font-weight="400" text-anchor="start">独立物流与应急接口待专业确认</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">开放与受控关系属于设计建议；精确尺寸、地形、消防和工程条件待专业深化</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>