<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>福祉公开账本</title><desc>三园 / 总体信息门户</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S12 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">福祉公开账本</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">三园 / 总体信息门户</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="360" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="360" width="10" height="255" rx="12" fill="#bd783b" stroke="#d9d5ca"/><text x="235" y="430" fill="#bd783b" font-size="38" font-weight="600" text-anchor="start">记忆簿</text><rect x="235" y="470" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="505" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="540" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="890" y="360" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="890" y="360" width="10" height="255" rx="12" fill="#177a70" stroke="#d9d5ca"/><text x="925" y="430" fill="#177a70" font-size="38" font-weight="600" text-anchor="start">时间簿</text><rect x="925" y="470" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="505" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="540" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="200" y="670" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="670" width="10" height="255" rx="12" fill="#729aa6" stroke="#d9d5ca"/><text x="235" y="740" fill="#729aa6" font-size="38" font-weight="600" text-anchor="start">舒适簿</text><rect x="235" y="780" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="815" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="850" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="890" y="670" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="890" y="670" width="10" height="255" rx="12" fill="#79698f" stroke="#d9d5ca"/><text x="925" y="740" fill="#79698f" font-size="38" font-weight="600" text-anchor="start">信任簿</text><rect x="925" y="780" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="815" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="850" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><text x="225" y="1040.0" fill="#18302f" font-size="28" font-weight="400" text-anchor="start">并列看来源与不确定性；不合成总分、不公开个人轨迹</text><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">看见改善、负担与未确定的部分</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">纸质公示、四簿并列、投诉与版本记录</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">可编辑功能示意；无比例；实际路径与设施条件待核验。</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">非 AI 基线</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">定期公示、纸质报告、听证和投诉渠道</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI 增强</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">只显示聚合指标、来源和不确定性；不得公开个人轨迹或</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">用总分掩盖权衡。</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">人工责任</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">运营者与独立复核者确认数据；只公开聚合结果</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">三园 / 总体信息门户</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">空间与服务均为参与者建议 / 来源：PARTICIPANT-DESIGN-V12 / 非已实施绩效</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>