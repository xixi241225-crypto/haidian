<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>S12｜福祉公开账本：看得懂，也能纠错</title><desc>空间载体与公示字段 / 非实时数据仪表盘</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S12 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">S12｜福祉公开账本：看得懂，也能纠错</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">空间载体与公示字段 / 非实时数据仪表盘</text><rect x="110" y="280" width="1580" height="950" rx="0" fill="#fffdf8" stroke="none"/><text x="175" y="350" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">公开信息台｜公示字段示意</text><rect x="160" y="413" width="9" height="130" rx="0" fill="#bd783b" stroke="none"/><text x="205" y="465" fill="#bd783b" font-size="32" font-weight="400" text-anchor="start">记忆簿</text><text x="455" y="465.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">遗产解释与纠错</text><text x="455" y="522.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">档案来源 / 审核责任 / 更正版本</text><path d="M205.0,557.0 L1580.0,557.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="585" width="9" height="130" rx="0" fill="#177a70" stroke="none"/><text x="205" y="637" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">时间簿</text><text x="455" y="637.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">到达与等待负担</text><text x="455" y="694.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">路径记录 / 采样时段 / 不同使用者</text><path d="M205.0,729.0 L1580.0,729.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="757" width="9" height="130" rx="0" fill="#729aa6" stroke="none"/><text x="205" y="809" fill="#729aa6" font-size="32" font-weight="400" text-anchor="start">舒适簿</text><text x="455" y="809.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">遮荫、噪声与可休息性</text><text x="455" y="866.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">观测方法 / 季节与天气 / 故障状态</text><path d="M205.0,901.0 L1580.0,901.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="929" width="9" height="130" rx="0" fill="#79698f" stroke="none"/><text x="205" y="981" fill="#79698f" font-size="32" font-weight="400" text-anchor="start">信任簿</text><text x="455" y="981.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">解释、申诉与人工纠错</text><text x="455" y="1038.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">规则版本 / 责任人 / 申诉进度</text><path d="M205.0,1073.0 L1580.0,1073.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="175" y="1190.0" fill="#bd783b" font-size="25" font-weight="400" text-anchor="start">示例字段 / 尚无实测值 / 来源与缺失状态始终可见</text><circle cx="1880.0" cy="325.0" r="24" fill="#177a70" stroke="none" stroke-width="2"/><text x="1880" y="334" fill="white" font-size="23" font-weight="600" text-anchor="middle">01</text><text x="1930" y="330.0" fill="#177a70" font-size="33" font-weight="400" text-anchor="start">并列阅读</text><text x="1870" y="422.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">四簿保留不同使用者的收益与负担，不合成总分。</text><circle cx="1880.0" cy="630.0" r="24" fill="#bd783b" stroke="none" stroke-width="2"/><text x="1880" y="639" fill="white" font-size="23" font-weight="600" text-anchor="middle">02</text><text x="1930" y="635.0" fill="#bd783b" font-size="33" font-weight="400" text-anchor="start">可核对</text><text x="1870" y="727.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">每条公示保留来源、方法、时间与责任人。</text><circle cx="1880.0" cy="935.0" r="24" fill="#79698f" stroke="none" stroke-width="2"/><text x="1880" y="944" fill="white" font-size="23" font-weight="600" text-anchor="middle">03</text><text x="1930" y="940.0" fill="#79698f" font-size="33" font-weight="400" text-anchor="start">能纠错</text><text x="1870" y="1032.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">纸质报告、热线与人工受理常设；只公开聚合结果。</text><path d="M170.0,1372.0 L240.0,1372.0" fill="none" stroke="#177a70" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="1380" fill="#687772" font-size="25" font-weight="400" text-anchor="start">现场公示</text><path d="M790.0,1372.0 L860.0,1372.0" fill="none" stroke="#bd783b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="880" y="1380" fill="#687772" font-size="25" font-weight="400" text-anchor="start">人工复核</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">空间策略示意 / 无比例；精确路径、权限与工程条件另行核验</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>