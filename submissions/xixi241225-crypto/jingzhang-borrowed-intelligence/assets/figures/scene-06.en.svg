<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Public-Space Steward</title><desc>Spine / Three Commons maintenance</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S06 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Public-Space Steward</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Spine / Three Commons maintenance</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="455" width="290" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="225" y="530.0" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Find / Report</text><path d="M495.0,570.0 L540.0,570.0" fill="none" stroke="#177a70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M540.0,570.0 L518.0,580.0 L518.0,560.0 L540.0,570.0" fill="#177a70" stroke="#177a70" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="540" y="615" width="290" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="565" y="690.0" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Human check</text><path d="M835.0,730.0 L880.0,730.0" fill="none" stroke="#177a70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M880.0,730.0 L858.0,740.0 L858.0,720.0 L880.0,730.0" fill="#177a70" stroke="#177a70" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="880" y="455" width="290" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="905" y="530.0" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Assign / Repair</text><path d="M1175.0,570.0 L1220.0,570.0" fill="none" stroke="#177a70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1220.0,570.0 L1198.0,580.0 L1198.0,560.0 L1220.0,570.0" fill="#177a70" stroke="#177a70" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="1220" y="615" width="290" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="1245" y="690.0" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Verify / Publish</text><text x="220" y="970.0" fill="#18302f" font-size="32" font-weight="400" text-anchor="start">Keep paper forms and hotline; publish job status, not reporter identity</text><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">Know who handles a reported fault</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Inspection, paper job cards, hotline and notice point</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Editable functional diagram; unscaled; verify actual routes and facilities.</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Low-tech baseline</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Inspection sheets, cleaning and repair requests,</text><text x="1740" y="402.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">notices, and a staffed hotline</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI enhancement</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Aggregate facility status and work orders, with</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">human confirmation of exceptions; no default facial</text><text x="1740" y="810.84" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">recognition.</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Human responsibility</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Manager confirms and assigns jobs; publish</text><text x="1740" y="1132.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">aggregate status, not identities</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Spine / Three Commons maintenance</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Participant spatial/service proposal / Source: PARTICIPANT-DESIGN-V12 / Not achieved outcomes</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.4 / 2026-10-06</text></svg>