<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>蓝绿城市孪生</title><desc>众智园 / 水绿观察接口</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S07 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">蓝绿城市孪生</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">众智园 / 水绿观察接口</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><path d="M180.0,750.0 L500.0,750.0 L700.0,855.0 L1090.0,855.0 L1310.0,750.0 L1540.0,750.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M520.0,750.0 L720.0,850.0 L1040.0,850.0 L1230.0,750.0" fill="#d9e8e9" stroke="#729aa6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="550.0" cy="665.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><path d="M550.0,665.0 L550.0,730.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1180.0" cy="680.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><path d="M1180.0,680.0 L1180.0,745.0" fill="none" stroke="#687772" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,690.0 L920.0,850.0" fill="none" stroke="#729aa6" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,700.0 L955.0,700.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,725.0 L955.0,725.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,750.0 L955.0,750.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,775.0 L955.0,775.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,800.0 L955.0,800.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M920.0,825.0 L955.0,825.0" fill="none" stroke="#729aa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="1240" y="375" width="280" height="230" rx="12" fill="#e8eee9" stroke="#d9d5ca"/><text x="1260" y="425.0" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">公开观测
人工复</text><text x="1260" y="467.92" fill="#177a70" font-size="29" font-weight="400" text-anchor="start">核</text><path d="M1260.0,605.0 L950.0,760.0" fill="none" stroke="#729aa6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="14 9"/><text x="210" y="1000.0" fill="#18302f" font-size="28" font-weight="400" text-anchor="start">只表达观察与维护关系；深度、溢流与边坡待专业深化</text><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">观察水绿变化并识别模型限制</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">标尺、植物说明、观察点与安全边界</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">可编辑功能示意；无比例；实际路径与设施条件待核验。</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">非 AI 基线</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">雨水标尺、植物说明、人工监测和疏散规则</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI 增强</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">辅助观察积水、热和植物状态；模型只支持维护判断，不</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">替代工程结论。</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">人工责任</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">专业维护者核验异常；模型不替代防汛或工程判断</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">众智园 / 水绿观察接口</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">空间与服务均为参与者建议 / 来源：PARTICIPANT-DESIGN-V12 / 非已实施绩效</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>