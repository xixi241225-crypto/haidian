<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>安静借景路</title><desc>主脉 / 生活缝安静院</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S02 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">安静借景路</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">主脉 / 生活缝安静院</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><path d="M210.0,490.0 L1520.0,490.0" fill="none" stroke="#687772" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/><path d="M210.0,550.0 L1520.0,550.0" fill="none" stroke="#177a70" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M440.0,550.0 L630.0,870.0 L1100.0,870.0 L1300.0,550.0" fill="none" stroke="#177a70" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="825.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="585" y="910" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><circle cx="950.0" cy="825.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="900" y="910" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><circle cx="1130.0" cy="750.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="1080" y="835" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><rect x="236" y="342" width="251.24" height="49" rx="5" fill="#fffdf7" stroke="none"/><text x="245" y="380" fill="#687772" font-size="34" font-weight="600" text-anchor="start">连续的主要路径</text><rect x="641" y="975" width="443.32" height="46" rx="5" fill="#fffdf7" stroke="none"/><text x="650" y="1010" fill="#177a70" font-size="31" font-weight="600" text-anchor="start">安静绕行与休息 / 状态待核</text><circle cx="260.0" cy="550.0" r="30" fill="white" stroke="#177a70" stroke-width="5"/><circle cx="1440.0" cy="550.0" r="30" fill="white" stroke="#177a70" stroke-width="5"/><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">在通勤主路之外找到安静选择</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">平行绕行、树荫座椅与明确再汇合点</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">可编辑功能示意；无比例；实际路径与设施条件待核验。</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">非 AI 基线</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">连续路标、安静绕行、座椅和遮荫</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI 增强</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">按噪声、拥挤和感官偏好建议路线；可关闭定位并改用固</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">定地图。</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">人工责任</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">运营者巡查噪声和路线；状态不明时显示待核</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">主脉 / 生活缝安静院</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">空间与服务均为参与者建议 / 来源：PARTICIPANT-DESIGN-V12 / 非已实施绩效</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>