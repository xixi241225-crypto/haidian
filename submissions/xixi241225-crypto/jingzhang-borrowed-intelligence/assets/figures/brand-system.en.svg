<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Brand and wayfinding | An open borrowed-view frame</title><desc>Original mark proposal; no third-party logos or official identity</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">D01 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Brand and wayfinding | An open borrowed-view frame</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Original mark proposal; no third-party logos or official identity</text><rect x="95" y="255" width="1110" height="1150" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><path d="M280.0,420.0 L280.0,1020.0 L930.0,1020.0" fill="none" stroke="#177a70" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/><path d="M380.0,420.0 L1030.0,420.0 L1030.0,915.0" fill="none" stroke="#177a70" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/><path d="M420.0,860.0 L800.0,560.0" fill="none" stroke="#bd783b" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/><path d="M470.0,910.0 L850.0,610.0" fill="none" stroke="#bd783b" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/><circle cx="425.0" cy="860.0" r="28" fill="#177a70" stroke="none" stroke-width="2"/><circle cx="655.0" cy="735.0" r="28" fill="#bd783b" stroke="none" stroke-width="2"/><circle cx="825.0" cy="610.0" r="28" fill="#79698f" stroke="none" stroke-width="2"/><text x="215" y="1155" fill="#18302f" font-size="52" font-weight="600" text-anchor="start">BORROWED INTELLIGENCE</text><text x="215" y="1240.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Memory calibrates intelligence; wellbeing measures the future</text><text x="1310" y="305" fill="#177a70" font-size="34" font-weight="600" text-anchor="start">One grammar for service, direction and evidence</text><rect x="1310" y="365" width="350" height="170" rx="12" fill="#177a70" stroke="#d9d5ca"/><text x="1340" y="430" fill="white" font-size="38" font-weight="600" text-anchor="start">01</text><text x="1340" y="495" fill="white" font-size="30" font-weight="400" text-anchor="start">Validation</text><rect x="1700" y="365" width="350" height="170" rx="12" fill="#bd783b" stroke="#d9d5ca"/><text x="1730" y="430" fill="white" font-size="38" font-weight="600" text-anchor="start">02</text><text x="1730" y="495" fill="white" font-size="30" font-weight="400" text-anchor="start">Everyday life</text><rect x="2090" y="365" width="350" height="170" rx="12" fill="#79698f" stroke="#d9d5ca"/><text x="2120" y="430" fill="white" font-size="38" font-weight="600" text-anchor="start">03</text><text x="2120" y="495" fill="white" font-size="30" font-weight="400" text-anchor="start">Human pace</text><text x="1310" y="675.0" fill="#18302f" font-size="32" font-weight="400" text-anchor="start">Physical signs first; digital content optional</text><text x="1310" y="855.0" fill="#18302f" font-size="32" font-weight="400" text-anchor="start">Direction / Hours / Human responsibility / Help</text><text x="1310" y="1035.0" fill="#18302f" font-size="32" font-weight="400" text-anchor="start">Distinguish public reference, unverified and concept</text><text x="1310" y="1215.0" fill="#18302f" font-size="32" font-weight="400" text-anchor="start">Users must verify contrast and readability</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Concept design · Relationships and functions · Not a statutory or engineering plan</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>