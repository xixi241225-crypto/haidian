<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Quiet Borrowed-View Path</title><desc>Spine / Quiet living-seam court</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S02 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Quiet Borrowed-View Path</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Spine / Quiet living-seam court</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><path d="M210.0,490.0 L1520.0,490.0" fill="none" stroke="#687772" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/><path d="M210.0,550.0 L1520.0,550.0" fill="none" stroke="#177a70" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M440.0,550.0 L630.0,870.0 L1100.0,870.0 L1300.0,550.0" fill="none" stroke="#177a70" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="825.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="585" y="910" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><circle cx="950.0" cy="825.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="900" y="910" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><circle cx="1130.0" cy="750.0" r="70" fill="#d6ddc9" stroke="none" stroke-width="2"/><rect x="1080" y="835" width="110" height="22" rx="12" fill="#b18c62" stroke="#d9d5ca"/><rect x="236" y="342" width="474.96000000000004" height="49" rx="5" fill="#fffdf7" stroke="none"/><text x="245" y="380" fill="#687772" font-size="34" font-weight="600" text-anchor="start">Continuous primary route</text><rect x="641" y="975" width="729.7600000000001" height="46" rx="5" fill="#fffdf7" stroke="none"/><text x="650" y="1010" fill="#177a70" font-size="31" font-weight="600" text-anchor="start">Quiet detour and rest / Verify conditions</text><circle cx="260.0" cy="550.0" r="30" fill="white" stroke="#177a70" stroke-width="5"/><circle cx="1440.0" cy="550.0" r="30" fill="white" stroke="#177a70" stroke-width="5"/><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">Find a quiet alternative to the commuter route</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Parallel detour, shaded seats and a clear rejoining point</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Editable functional diagram; unscaled; verify actual routes and facilities.</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Low-tech baseline</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Continuous signs, a quiet alternative route, seating,</text><text x="1740" y="402.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">and shade</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI enhancement</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Suggest routes by noise, crowding, and sensory</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">preference; users can disable location and use a</text><text x="1740" y="810.84" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">fixed map.</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Human responsibility</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Operator checks noise and route; show unverified</text><text x="1740" y="1132.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">states explicitly</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Spine / Quiet living-seam court</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Participant spatial/service proposal / Source: PARTICIPANT-DESIGN-V12 / Not achieved outcomes</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.4 / 2026-10-06</text></svg>