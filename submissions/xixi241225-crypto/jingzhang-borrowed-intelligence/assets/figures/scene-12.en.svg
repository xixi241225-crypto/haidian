<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>S12 | Public wellbeing ledger: readable and correctable</title><desc>Physical information point and fields / Not a live data dashboard</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S12 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">S12 | Public wellbeing ledger: readable and correctable</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Physical information point and fields / Not a live data dashboard</text><rect x="110" y="280" width="1580" height="950" rx="0" fill="#fffdf8" stroke="none"/><text x="175" y="350" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Public information point | Proposed fields</text><rect x="160" y="413" width="9" height="130" rx="0" fill="#bd783b" stroke="none"/><text x="205" y="465" fill="#bd783b" font-size="32" font-weight="400" text-anchor="start">Memory</text><text x="455" y="465.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Interpretation + corrections</text><text x="455" y="522.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Archive source / Reviewer / Correction version</text><path d="M205.0,557.0 L1580.0,557.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="585" width="9" height="130" rx="0" fill="#177a70" stroke="none"/><text x="205" y="637" fill="#177a70" font-size="32" font-weight="400" text-anchor="start">Time</text><text x="455" y="637.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Arrival + waiting burden</text><text x="455" y="694.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Route record / Sample time / Different users</text><path d="M205.0,729.0 L1580.0,729.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="757" width="9" height="130" rx="0" fill="#729aa6" stroke="none"/><text x="205" y="809" fill="#729aa6" font-size="32" font-weight="400" text-anchor="start">Comfort</text><text x="455" y="809.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Shade, noise + places to rest</text><text x="455" y="866.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Observation method / Season + weather / Fault state</text><path d="M205.0,901.0 L1580.0,901.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="929" width="9" height="130" rx="0" fill="#79698f" stroke="none"/><text x="205" y="981" fill="#79698f" font-size="32" font-weight="400" text-anchor="start">Trust</text><text x="455" y="981.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Explanation, appeals + correction</text><text x="455" y="1038.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Rule version / Responsible person / Appeal status</text><path d="M205.0,1073.0 L1580.0,1073.0" fill="none" stroke="#d9d5ca" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="175" y="1190.0" fill="#bd783b" font-size="25" font-weight="400" text-anchor="start">Proposed fields / No measured values yet / Sources and missing states stay visible</text><circle cx="1880.0" cy="325.0" r="24" fill="#177a70" stroke="none" stroke-width="2"/><text x="1880" y="334" fill="white" font-size="23" font-weight="600" text-anchor="middle">01</text><text x="1930" y="330.0" fill="#177a70" font-size="33" font-weight="400" text-anchor="start">Read in parallel</text><text x="1870" y="422.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Keep different users’ benefits and burdens visible</text><text x="1870" y="461.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">, without a total score.</text><circle cx="1880.0" cy="630.0" r="24" fill="#bd783b" stroke="none" stroke-width="2"/><text x="1880" y="639" fill="white" font-size="23" font-weight="600" text-anchor="middle">02</text><text x="1930" y="635.0" fill="#bd783b" font-size="33" font-weight="400" text-anchor="start">Verify the record</text><text x="1870" y="727.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Every notice retains source, method, date and a</text><text x="1870" y="766.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">responsible person.</text><circle cx="1880.0" cy="935.0" r="24" fill="#79698f" stroke="none" stroke-width="2"/><text x="1880" y="944" fill="white" font-size="23" font-weight="600" text-anchor="middle">03</text><text x="1930" y="940.0" fill="#79698f" font-size="33" font-weight="400" text-anchor="start">Correct and appeal</text><text x="1870" y="1032.0" fill="#687772" font-size="27" font-weight="400" text-anchor="start">Keep paper reports, a hotline and staffed appeals;</text><text x="1870" y="1071.96" fill="#687772" font-size="27" font-weight="400" text-anchor="start">publish aggregates only.</text><path d="M170.0,1372.0 L240.0,1372.0" fill="none" stroke="#177a70" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="1380" fill="#687772" font-size="25" font-weight="400" text-anchor="start">Physical notices</text><path d="M790.0,1372.0 L860.0,1372.0" fill="none" stroke="#bd783b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="880" y="1380" fill="#687772" font-size="25" font-weight="400" text-anchor="start">Human verification</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Spatial strategy / Unscaled; verify exact routes, permission and engineering conditions</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.3 / 2026-10-06</text></svg>