<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>Public Wellbeing Ledger</title><desc>Three Commons / Belt information point</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">S12 / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">Public Wellbeing Ledger</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Three Commons / Belt information point</text><rect x="95" y="255" width="1560" height="840" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="360" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="360" width="10" height="255" rx="12" fill="#bd783b" stroke="#d9d5ca"/><text x="235" y="430" fill="#bd783b" font-size="38" font-weight="600" text-anchor="start">Memory</text><rect x="235" y="470" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="505" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="540" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="890" y="360" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="890" y="360" width="10" height="255" rx="12" fill="#177a70" stroke="#d9d5ca"/><text x="925" y="430" fill="#177a70" font-size="38" font-weight="600" text-anchor="start">Time</text><rect x="925" y="470" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="505" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="540" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="200" y="670" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="200" y="670" width="10" height="255" rx="12" fill="#729aa6" stroke="#d9d5ca"/><text x="235" y="740" fill="#729aa6" font-size="38" font-weight="600" text-anchor="start">Comfort</text><rect x="235" y="780" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="815" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="235" y="850" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="890" y="670" width="620" height="255" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="890" y="670" width="10" height="255" rx="12" fill="#79698f" stroke="#d9d5ca"/><text x="925" y="740" fill="#79698f" font-size="38" font-weight="600" text-anchor="start">Trust</text><rect x="925" y="780" width="370" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="815" width="260" height="12" rx="0" fill="#d6ddc9" stroke="none"/><rect x="925" y="850" width="410" height="12" rx="0" fill="#d6ddc9" stroke="none"/><text x="225" y="1040.0" fill="#18302f" font-size="28" font-weight="400" text-anchor="start">Compare sources and uncertainty; no total score or personal trajectories</text><text x="100" y="1200.0" fill="#177a70" font-size="40" font-weight="400" text-anchor="start">See improvements, burdens and uncertainty</text><text x="100" y="1280.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Paper notices, four parallel ledgers, appeals and versions</text><text x="100" y="1420.0" fill="#687772" font-size="24" font-weight="400" text-anchor="start">Editable functional diagram; unscaled; verify actual routes and facilities.</text><text x="1740" y="300" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Low-tech baseline</text><text x="1740" y="360.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Periodic disclosure, printed reports, hearings, and</text><text x="1740" y="402.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">complaint channels</text><text x="1740" y="665" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">AI enhancement</text><text x="1740" y="725.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Display only aggregate metrics, sources, and</text><text x="1740" y="767.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">uncertainty; never reveal individual traces or hide</text><text x="1740" y="810.84" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">trade-offs in a total score.</text><text x="1740" y="1030" fill="#177a70" font-size="33" font-weight="600" text-anchor="start">Human responsibility</text><text x="1740" y="1090.0" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">Operator and independent reviewer verify data;</text><text x="1740" y="1132.92" fill="#18302f" font-size="29" font-weight="400" text-anchor="start">aggregate results only</text><text x="1740" y="1440.0" fill="#687772" font-size="26" font-weight="400" text-anchor="start">Three Commons / Belt information point</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">Participant spatial/service proposal / Source: PARTICIPANT-DESIGN-V12 / Not achieved outcomes</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>