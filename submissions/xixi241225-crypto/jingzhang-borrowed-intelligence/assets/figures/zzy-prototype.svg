<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1650" viewBox="0 0 2600 1650"><title>众智园 · 共智验证园｜功能与流线</title><desc>无比例功能与邻接原型｜用于组织路径、使用与权限；不对应已选宗地</desc><style>text{font-family:"Jingzhang Reading","Noto Sans SC","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f6f3ec"/><text x="85" y="65" fill="#177a70" font-size="22" font-weight="600" text-anchor="start">B01F / BORROWED INTELLIGENCE</text><text x="85" y="135" fill="#18302f" font-size="55" font-weight="600" text-anchor="start">众智园 · 共智验证园｜功能与流线</text><text x="85" y="195" fill="#687772" font-size="26" font-weight="400" text-anchor="start">无比例功能与邻接原型｜用于组织路径、使用与权限；不对应已选宗地</text><rect x="85" y="245" width="1695" height="1240" rx="0" fill="#fffdf8" stroke="#d9d5ca"/><rect x="185" y="340" width="1450" height="1030" rx="8" fill="#e8ede0" stroke="#bec8b8"/><rect x="350" y="535" width="790" height="500" rx="45" fill="#e4e8df" stroke="#9ea997"/><rect x="405" y="590" width="685" height="390" rx="12" fill="#f0ebdf" stroke="#acafa4"/><text x="740" y="670" fill="#177a70" font-size="35" font-weight="600" text-anchor="middle">受控验证庭院</text><path d="M485.0,785.0 L595.0,710.0 L795.0,810.0 L965.0,710.0" fill="none" stroke="#bdad87" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/><text x="740" y="920" fill="#687772" font-size="25" font-weight="400" text-anchor="middle">机器人 / 端侧服务 / 运维试验</text><path d="M255.0,1200.0 L255.0,465.0 L1230.0,465.0 L1230.0,1120.0 L550.0,1120.0" fill="none" stroke="#177a70" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="581" y="421" width="361.0" height="40" rx="5" fill="#fffdf7" stroke="none"/><text x="590" y="450" fill="#177a70" font-size="25" font-weight="600" text-anchor="start">公共观察廊 / 与测试区分离</text><rect x="366" y="332" width="710" height="130" rx="1" fill="#ded7c9" stroke="none"/><rect x="360" y="325" width="710" height="130" rx="1" fill="#e4e0e8" stroke="#acaa9e"/><path d="M367,337H1063" stroke="#9b9f99" stroke-width="4"/><text x="715.0" y="399.8" fill="#18302f" font-size="28" font-weight="500" text-anchor="middle">研发与治理评审</text><rect x="1296" y="567" width="235" height="320" rx="1" fill="#ded7c9" stroke="none"/><rect x="1290" y="560" width="235" height="320" rx="1" fill="#dde1df" stroke="#acaa9e"/><path d="M1297,572H1518" stroke="#9b9f99" stroke-width="4"/><text x="1407.5" y="729.1" fill="#18302f" font-size="26" font-weight="500" text-anchor="middle">设备后场</text><rect x="306" y="1222" width="375" height="110" rx="1" fill="#ded7c9" stroke="none"/><rect x="300" y="1215" width="375" height="110" rx="1" fill="#e1e8dc" stroke="#acaa9e"/><path d="M307,1227H668" stroke="#9b9f99" stroke-width="4"/><text x="487.5" y="1279.1" fill="#18302f" font-size="26" font-weight="500" text-anchor="middle">共议 / 失败记录</text><rect x="815" y="1155" width="365" height="180" rx="25" fill="#dce8e7" stroke="#9bb7bb"/><text x="1000" y="1225" fill="#729aa6" font-size="29" font-weight="500" text-anchor="middle">蓝绿观察接口</text><path d="M1560.0,1250.0 L1475.0,895.0" fill="none" stroke="#687772" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1475.0,895.0 L1489.8,914.1 L1470.4,918.7 L1475.0,895.0" fill="#687772" stroke="#687772" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="1251" y="1391" width="238.5" height="40" rx="5" fill="#fffdf7" stroke="none"/><text x="1260" y="1420" fill="#687772" font-size="25" font-weight="600" text-anchor="start">独立设备与应急入口</text><path d="M260.0,1420.0 L260.0,1200.0" fill="none" stroke="#177a70" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M260.0,1200.0 L270.0,1222.0 L250.0,1222.0 L260.0,1200.0" fill="#177a70" stroke="#177a70" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="311" y="1381" width="116.0" height="40" rx="5" fill="#fffdf7" stroke="none"/><text x="320" y="1410" fill="#177a70" font-size="25" font-weight="600" text-anchor="start">公众入口</text><circle cx="195.0" cy="363.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="190.0" cy="355.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M190.0,347.0 L190.0,363.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1195.0" cy="373.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1190.0" cy="365.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1190.0,357.0 L1190.0,373.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1445.0" cy="403.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1440.0" cy="395.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1440.0,387.0 L1440.0,403.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1575.0" cy="958.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="1570.0" cy="950.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M1570.0,942.0 L1570.0,958.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="655.0" cy="1148.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="650.0" cy="1140.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M650.0,1132.0 L650.0,1148.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="210.0" cy="958.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="205.0" cy="950.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M205.0,942.0 L205.0,958.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="195.0" cy="1258.0" r="37" fill="#d0d7c5" stroke="none" stroke-width="2"/><circle cx="190.0" cy="1250.0" r="35" fill="#bdcbb0" stroke="#98ae92" stroke-width="1"/><path d="M190.0,1242.0 L190.0,1258.0" fill="none" stroke="#8ca185" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="1830" y="245" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="245" width="7" height="235" fill="#177a70"/><text x="1855" y="293" fill="#177a70" font-size="31" font-weight="600" text-anchor="start">观察先于进入</text><text x="1855" y="345" fill="#687772" font-size="25" font-weight="400" text-anchor="start">从观察廊看懂风险、规则与状态</text><text x="1855" y="385" fill="#687772" font-size="25" font-weight="400" text-anchor="start">公众路径不穿过动态测试庭院</text><rect x="1830" y="520" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="520" width="7" height="235" fill="#bd783b"/><text x="1855" y="568" fill="#bd783b" font-size="31" font-weight="600" text-anchor="start">受控验证</text><text x="1855" y="620" fill="#687772" font-size="25" font-weight="400" text-anchor="start">每场测试有时段、权限与人工值守</text><text x="1855" y="660" fill="#687772" font-size="25" font-weight="400" text-anchor="start">停机后恢复普通公共空间功能</text><rect x="1830" y="795" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="795" width="7" height="235" fill="#79698f"/><text x="1855" y="843" fill="#79698f" font-size="31" font-weight="600" text-anchor="start">设备与应急分开组织</text><text x="1855" y="895" fill="#687772" font-size="25" font-weight="400" text-anchor="start">维护、充电、物料由独立后场进入</text><text x="1855" y="935" fill="#687772" font-size="25" font-weight="400" text-anchor="start">不在观众路径上混行</text><rect x="1830" y="1070" width="685" height="235" rx="12" fill="#fffdf8" stroke="#d9d5ca"/><rect x="1830" y="1070" width="7" height="235" fill="#687772"/><text x="1855" y="1118" fill="#687772" font-size="31" font-weight="600" text-anchor="start">公开结果与退出</text><text x="1855" y="1170" fill="#687772" font-size="25" font-weight="400" text-anchor="start">共议室记录成功、失败与纠错</text><text x="1855" y="1210" fill="#687772" font-size="25" font-weight="400" text-anchor="start">T1/T2 保留非 AI 基线</text><path d="M85.0,1560.0 L2515.0,1560.0" fill="none" stroke="#d9d5ca" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="start">开放与受控关系属于设计建议；精确尺寸、地形、消防和工程条件待专业深化</text><text x="2515" y="1607" fill="#687772" font-size="22" font-weight="400" text-anchor="end">V1.2 / 2026-10-05</text></svg>